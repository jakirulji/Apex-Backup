name: Android CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify Android project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lint

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify debug APK signature
        shell: bash
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare test artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: test.apk
          if-no-files-found: error
          retention-days: 14
