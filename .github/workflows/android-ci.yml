name: Android CI

'on':
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, sign and verify release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run tests and lint
        run: gradle --no-daemon testDebugUnitTest lint

      - name: Build disposable Test Lab APK
        run: gradle --no-daemon :test-lab:assembleDebug

      - name: Upload disposable Test Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-backup-test-lab
          path: test-lab/build/outputs/apk/debug/test-lab-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub secret is missing: $name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/apex-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi

          keytool -list -keystore "$KEYSTORE_PATH" -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "APEX_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "APEX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "APEX_KEY_ALIAS=$KEY_ALIAS"
            echo "APEX_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename release APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "Apex Backup.apk"

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "Apex Backup.apk" > release-signature.txt
          RELEASE_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' release-signature.txt | awk -F': ' '{print $2}')"
          if [[ -z "$RELEASE_CERT" ]]; then
            echo "::error::Could not read release signing certificate fingerprint"
            exit 1
          fi
          echo "Release APK signature verified."
          echo "Certificate SHA-256: $RELEASE_CERT"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-backup-release-apk
          path: "Apex Backup.apk"
          if-no-files-found: error
          retention-days: 14
