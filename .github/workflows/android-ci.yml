name: Android CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify Android project
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      APEX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      APEX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      APEX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Require signing secrets for branch builds
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          for name in KEYSTORE_BASE64 APEX_KEYSTORE_PASSWORD APEX_KEY_ALIAS APEX_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret for signing: $name"
              exit 1
            fi
          done

      - name: Prepare release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apex-backup-release.jks"
          test -s "$RUNNER_TEMP/apex-backup-release.jks"
          echo "APEX_KEYSTORE_PATH=$RUNNER_TEMP/apex-backup-release.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lint

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify debug APK signature
        shell: bash
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Assemble release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK signature
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        shell: bash
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare test artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: test.apk
          if-no-files-found: error
          retention-days: 14
