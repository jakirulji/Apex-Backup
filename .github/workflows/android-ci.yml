name: Android CI

'on':
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, sign and verify Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run tests and lint
        run: gradle --no-daemon testDebugUnitTest lint

      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub secret is missing: $name"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/apex-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi

          keytool -list -keystore "$KEYSTORE_PATH" -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "APEX_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "APEX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "APEX_KEY_ALIAS=$KEY_ALIAS"
            echo "APEX_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk test.apk
          cp app/build/outputs/apk/release/app-release.apk "Apex Backup.apk"

      - name: Verify APK signatures and certificate match
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify --verbose --print-certs test.apk > debug-signature.txt
          "$APKSIGNER" verify --verbose --print-certs "Apex Backup.apk" > release-signature.txt

          DEBUG_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' debug-signature.txt | awk -F': ' '{print $2}')"
          RELEASE_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' release-signature.txt | awk -F': ' '{print $2}')"

          if [[ -z "$DEBUG_CERT" || -z "$RELEASE_CERT" ]]; then
            echo "::error::Could not read signing certificate fingerprints"
            exit 1
          fi

          if [[ "$DEBUG_CERT" != "$RELEASE_CERT" ]]; then
            echo "::error::Debug and release APK certificates do not match"
            exit 1
          fi

          echo "Both APKs are validly signed with the same certificate."
          echo "Certificate SHA-256: $DEBUG_CERT"

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: dev-signed-apks
          path: |
            test.apk
            Apex Backup.apk
          if-no-files-found: error
          retention-days: 14
